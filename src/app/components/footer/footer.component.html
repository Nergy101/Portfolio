<mat-card class="footer" id="end">
  <div class="badge-container">
    <a
      href="https://github.com/Nergy101/Portfolio/actions/workflows/pipeline.yml"
      target="_blank"
      rel="noopener">
      <img
        src="https://github.com/Nergy101/Portfolio/actions/workflows/pipeline.yml/badge.svg"
        [alt]="'badges.deploy-docker-image' | translate" />
    </a>
    <a
      href="https://github.com/Nergy101/Portfolio/actions/workflows/e2e-nightly.yml"
      target="_blank"
      rel="noopener">
      <img
        src="https://github.com/Nergy101/Portfolio/actions/workflows/e2e-nightly.yml/badge.svg"
        [alt]="'badges.build-check' | translate" />
    </a>
  </div>

  <div class="icons">
    <button
      mat-button
      (click)="navigateTo('https://github.com/Nergy101')"
      matTooltip="Visit my Github"
      matTooltipPosition="left">
      <fa-icon [icon]="faGithub" size="3x"></fa-icon>
    </button>

    <button
      mat-button
      (click)="
        navigateTo('https://www.linkedin.com/in/christian-van-dijk-657069134/')
      "
      matTooltip="Visit my LinkedIn"
      matTooltipPosition="right">
      <fa-icon [icon]="faLinkedin" size="3x"></fa-icon>
    </button>
  </div>
</mat-card>
